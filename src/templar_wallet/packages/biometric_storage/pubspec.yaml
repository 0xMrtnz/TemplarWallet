# Vendored from pub.dev biometric_storage 5.0.1 with ONLY the Android
# implementation kept: Templar uses it for the Android fingerprint vault unlock
# and must not drag libsecret (Linux) or CocoaPods (macOS) into desktop builds.
name: biometric_storage
description: |
  Secure Storage: Encrypted data store optionally secured by biometric lock with support
  for iOS, Android, MacOS. Partial support for Linux, Windows and web (localStorage).
version: 5.0.1
homepage: https://github.com/authpass/biometric_storage/

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=2.8.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  logging: ">=1.0.0 <2.0.0"
  plugin_platform_interface: ^2.0.0

  ffi: '>=1.0.0 <3.0.0'
  win32: '>=2.0.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.

flutter:
  plugin:
    platforms:
      android:
        package: design.codeux.biometric_storage
        pluginClass: BiometricStoragePlugin
